apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      component: worker
  template:
    metadata:
      labels:
        component: worker
    spec:
      containers:
        - name: worker
          image: stephengrider/multi-worker
          env:
            - name: REDIS_HOST # name of the environment variable inside the container
              value: redis-cluster-ip-service # value of the environment variable inside the container - name of cluster ip service for redis
            - name: REDIS_PORT
              value: "6379"