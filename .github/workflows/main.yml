name: Deploy MultiK8s

# Travis: deploy.on.branch = main  ->  run the whole thing on every push to main
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SHA: ${{ github.sha }}   # Travis: SHA=$(git rev-parse HEAD)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Travis: gcloud auth activate-service-account --key-file service-account.json
      # This official action reads the base64 GCP_SA_KEY secret directly (no file needed).
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # Travis: curl sdk.cloud.google.com | bash  +  gcloud config set project
      - name: Set up the gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: multi-k8s-507009

      # Travis: gcloud container clusters get-credentials multi-k8s
      # This action also installs gke-gcloud-auth-plugin, which apt could not find.
      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: multi-k8s
          location: us-central1

      # Travis: echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # Travis before_install: build the test image
      - name: Build the test image
        run: docker build -t chakri1408/react-test -f ./client/Dockerfile.dev ./client

      # Travis script: run the tests
      - name: Run tests
        run: docker run -e CI=true chakri1408/react-test npm test

      # Travis deploy: bash ./deploy.sh  (build+push all 3 images, apply k8s, set images)
      - name: Deploy
        run: bash ./deploy.sh
